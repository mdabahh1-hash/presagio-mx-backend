  cifras originales sin desestacionalizar, los sectores por separado ni la estimación
  tradicional del PIB que el INEGI publica semanas después; tampoco revisiones posteriores. Si
  al 13 de noviembre de 2026 el INEGI no ha publicado la estimación oportuna del tercer
