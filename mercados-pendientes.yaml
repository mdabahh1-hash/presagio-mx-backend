question: "¿La capitalización de las stablecoins cerrará septiembre en US$309,500 millones o más?"
description: >-
  Escalera de septiembre de stablecoins: resuelve con el dato de DefiLlama del cierre del 30 de septiembre de 2026.
category: CRYPTO
subcategory: Stablecoins
resolution_criteria: >-
  Resuelve SÍ si la capitalización total en circulación de stablecoins vinculadas al dólar que publica DefiLlama con fecha del 1 de octubre de 2026 (foto de las 00:00 UTC, es decir, el cierre del 30 de septiembre) es igual o mayor a US$309,500 millones. Respaldo: suma de la categoría stablecoins de CoinGecko.
resolution_source_url: https://defillama.com/stablecoins
rules_cuerpo: >-
  Resuelve SÍ si el total en circulación de stablecoins vinculadas al dólar (serie totalCirculatingUSD.peggedUSD de DefiLlama) con fecha del 1 de octubre de 2026 es igual o mayor a US$309,500 millones. DefiLlama fecha cada dato a las 00:00 UTC, así que el dato del 1 de octubre refleja el cierre del 30 de septiembre. La suma de la categoría stablecoins de CoinGecko sirve como fuente de respaldo y de verificación. Si la fuente oficial deja de publicar el dato o cambia su metodología antes de la resolución, el equipo de VEREDIKT usará la fuente sustituta más cercana y lo anunciará en los comentarios del mercado antes de resolver.
context: >-
  DefiLlama registraba alrededor de US$309.5 mil millones en stablecoins vinculadas al dólar el 18 de septiembre de 2026, frente a US$306.2 mil millones un mes antes. La oferta de stablecoins crece cuando entra dinero nuevo al ecosistema cripto y se contrae cuando sale, por eso se sigue como termómetro de liquidez del mercado.
ends_at: 2026-09-30T23:59:00Z
