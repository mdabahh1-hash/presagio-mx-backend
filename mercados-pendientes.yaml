  Cómo se resuelve: con el boletín de la Estimación Oportuna del PIB Trimestral del INEGI
  (inegi.org.mx/temas/pibo) del 30 de octubre de 2026.
context: >-
  La estimación oportuna del INEGI del 30 de julio de 2026 reportó que el PIB creció 1.5 % en el
  segundo trimestre de 2026 respecto al primero (2.1 % anual), tras una caída de 0.8 % en el
  primer trimestre; en el cuarto trimestre de 2024 había bajado 0.6 % y en el segundo de 2025
  subió 0.7 %. Banxico señaló el 6 de agosto que la economía "presentó una reactivación" en el
  segundo trimestre, pero sigue previendo condiciones de holgura y "importantes riesgos a la
  baja para la actividad económica". Este mercado resuelve con la estimación oportuna, que
  después se revisa: de 18 estimaciones oportunas publicadas desde el cuarto trimestre de 2021,
  14 fueron positivas (78 %), y desde 2024, 7 de 10 (2024: +0.2, +0.2, +1.0, −0.6; 2025: +0.2,
  +0.7, −0.3, +0.8; 2026: −0.8, +1.5). La revisión posterior cambió el signo en 3 de esas 18 (por
  ejemplo, el +0.7 oportuno del segundo trimestre de 2025 quedó en 0.0), sin sesgo sistemático
  (diferencia media de −0.05 puntos). La serie muestra reversión tras un trimestre fuerte: después
  de una oportuna de 0.8 % o más, la siguiente fue positiva en 5 de 7 casos (2 de 3 tras 1 % o
  más), y una regresión simple sobre las 16 parejas de trimestres consecutivos (coeficiente −0.34)
  sitúa la esperanza del tercer trimestre, partiendo del +1.5 %, en +0.1 % con una desviación de
  0.64 puntos. El INEGI publica la estimación del tercer trimestre el 30 de octubre de 2026.
