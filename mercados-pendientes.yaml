id: salario-minimo-2027-13
tipo: binario
question: ¿El salario mínimo general subirá 13 % o más para 2027?
description: Resuelve SÍ si el salario mínimo general diario para 2027 que fije la Conasami (y publique el Diario Oficial de la Federación) es al menos 13.0 % mayor que el de 2026 (315.04 pesos), es decir 355.99 pesos o más; NO si el aumento es menor.
category: ECONOMIA
resolution_criteria: Porcentaje de aumento del salario mínimo general (zona general del país, no la Zona Libre de la Frontera Norte) para 2027 respecto a 315.04 pesos diarios, según la resolución de la Conasami publicada en el DOF, redondeado a un decimal. 13.0 % o más = SÍ; menos = NO.
resolution_source_url: https://www.gob.mx/conasami
rules_cuerpo: >-
  Cuenta únicamente el salario mínimo general diario que regirá a partir del 1 de enero de 2027
  en la zona general del país, según la resolución del Consejo de Representantes de la Comisión
  Nacional de los Salarios Mínimos (Conasami) publicada en el Diario Oficial de la Federación. El
  aumento se calcula como (salario 2027 ÷ 315.04) − 1, redondeado a un decimal, sin importar cómo
  se integre (Monto Independiente de Recuperación más porcentaje de fijación). Resuelve SÍ si es
  13.0 % o más (355.99 pesos diarios o más). Resuelve NO si es menor. No cuentan la Zona Libre de
  la Frontera Norte ni los salarios mínimos profesionales. El mercado cierra el 20 de noviembre
  porque la Conasami no tiene fecha fija y puede anunciar antes de diciembre; se resuelve con la
  publicación oficial aunque llegue después del cierre. Si al 31 de diciembre de 2026 no se ha
  publicado la resolución para 2027, el mercado se cancela y se reembolsa.
rules_como: >-
  Cómo se resuelve: con el boletín de la Conasami (gob.mx/conasami) y la resolución publicada
  en el Diario Oficial de la Federación que fija los salarios mínimos para 2027.
context: >-
  Para 2026 la Conasami acordó el 3 de diciembre de 2025 un aumento de 13 % al salario mínimo
  general, de 278.80 a 315.04 pesos diarios, integrado por un Monto Independiente de
  Recuperación de 17.01 pesos más 6.5 % de fijación. Para 2025 el aumento fue de 12 % y para
  2024 de 20 %. El Plan México y el Programa Institucional 2025–2030 de la Conasami fijan la meta
  de que el salario mínimo alcance 2.5 canastas básicas en 2030, sin definir la canasta. La
  presidenta dijo en diciembre de 2024 y en septiembre de 2025 que el salario alcanzaba para 1.7
  canastas; con esa medida, hoy ronda 1.8–1.9 canastas y llegar a 2.5 en las cuatro fijaciones
  que faltan (2027–2030) requiere aumentos de entre 11 % y 12.6 % anual si la canasta se encarece
  3.5 % al año (lo que subió la Línea de Pobreza por Ingresos urbana entre septiembre de 2025 y
  agosto de 2026), y de entre 12 % y 13.7 % si se encarece 4.5 %: un 13 % queda por encima de la
  trayectoria salvo en el escenario de inflación alta. Medido directamente con la Línea de Pobreza
  por Ingresos urbana del INEGI (4,905 pesos al mes en agosto de 2026), el salario de 2026 (9,577
  pesos) equivale a 1.95 canastas y bastarían aumentos de 10–11 %. La Conasami suele resolver en
  los primeros días de diciembre (1 de diciembre en 2023, 4 en 2024, 3 en 2025).
ends_at: "2026-11-21T05:59:00Z"
initial_yes_price: 45
