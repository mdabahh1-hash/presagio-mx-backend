rules: |
  Gana la opción del club que sea campeón del Torneo Apertura 2026 de la Liga MX según el resultado oficial de la Liga MX (ligamx.net): el ganador de la final a ida y vuelta, aplicando si hace falta los criterios de desempate del reglamento de competencia (posición en la tabla general, tiempos extra o penales). Si el campeón no es uno de los ocho clubes nombrados, gana «Otro club».

  Según el calendario oficial de la Liga MX, la final está programada para el 10 y 13 de diciembre de 2026 o, si un club mexicano participa en la Copa Intercontinental, para el 24 y 27 de diciembre. El mercado se resuelve al terminar la final de vuelta. Si la final se pospone, el cierre se recorre a la nueva fecha oficial; si el torneo se cancela sin campeón, el mercado se cancela y las posiciones se reembolsan. Los clubes eliminados en el Play-In o en la Liguilla no se resuelven por separado: todas las opciones se liquidan juntas al final. Si ligamx.net y otro medio reportan campeones distintos, prevalece la Liga MX.

  El mercado cierra el 28 de diciembre de 2026 a las 00:00 h (CDMX) o antes, al silbatazo final de la final de vuelta. Gana exactamente un resultado: cada acción del ganador paga 1 PT y las demás valen 0.
context: >-
  El Apertura 2026 es el primer torneo de la temporada 2026-27 de la Liga MX: 17 jornadas del 16 de julio al 22 de noviembre y después la fase final, con cuartos de final del 25 al 29 de noviembre, semifinales del 2 al 6 de diciembre y la final el 10 y 13 de diciembre (o el 24 y 27 si un club mexicano juega la Copa Intercontinental), según el calendario oficial de la Liga MX. Cruz Azul es el campeón vigente: ganó el Clausura 2026 al vencer 2-1 en el marcador global a Pumas en la final del 24 de mayo de 2026. Al cierre de la Jornada 8 (14 de septiembre), Toluca (19 puntos), Guadalajara (17), América (16) y Cruz Azul (15) encabezan la tabla general.
