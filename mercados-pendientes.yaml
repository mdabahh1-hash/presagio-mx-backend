description: Resuelve SÍ si el rendimiento del bono del Tesoro de Estados Unidos a 10 años del último día hábil de octubre de 2026 (30 de octubre), según la curva de rendimientos del Tesoro (serie DGS10 de FRED), es de 5.00 % o más; NO si es menor.
category: ECONOMIA
resolution_criteria: Rendimiento a 10 años de la curva "par yield" del Departamento del Tesoro de EE.UU. para el 30 de octubre de 2026 (serie DGS10 de FRED), con dos decimales. 5.00 o más = SÍ; menor a 5.00 = NO.
resolution_source_url: https://fred.stlouisfed.org/series/DGS10
rules_cuerpo: >-
  Cuenta únicamente el rendimiento del bono del Tesoro de Estados Unidos a 10 años ("10 Yr" de la
  Daily Treasury Par Yield Curve) del último día hábil de octubre de 2026 (viernes 30 de
  octubre), tal como lo publica el Departamento del Tesoro y lo replica la serie DGS10 de FRED,
  con dos decimales. Resuelve SÍ si es de 5.00 % o más. Resuelve NO si es menor a 5.00 % (por
  ejemplo 4.99 %). No cuentan otros días ni cotizaciones intradía. El mercado cierra antes de la
  apertura de la sesión del 30 de octubre. Si ese día no hay publicación del Tesoro, cuenta la
  última de octubre; si al 6 de noviembre de 2026 la cifra no está publicada en ninguna de las
  dos fuentes, el mercado se cancela y se reembolsa.
rules_como: >-
  Cómo se resuelve: con la Daily Treasury Par Yield Curve del Departamento del Tesoro de EE.UU.
  (home.treasury.gov) y la serie DGS10 de FRED (fred.stlouisfed.org/series/DGS10).
context: >-
  El rendimiento del bono a 10 años cerró en 4.94 % el 17 de septiembre de 2026 tras tocar 5.01 %
  el 16 de septiembre; en agosto rondaba 4.65–4.75 %. La Reserva Federal subió su rango objetivo
  25 puntos base a 3.75–4.00 % el 16 de septiembre de 2026 por unanimidad, la primera alza tras
  tres recortes en 2025, y vuelve a decidir el 27 y 28 de octubre, antes del cierre que resuelve
  este mercado. En los últimos 60 días hábiles el rendimiento se movió unos 4 puntos base al día.
  Que la Fed suba no arrastra mecánicamente al tramo largo: el rendimiento a 10 años puede subir
  por persistencia de la inflación o por más emisión del Tesoro, o bajar si el mercado cree que
  las alzas frenarán la inflación o si hay búsqueda de refugio. El riesgo es de dos lados; el
  precio inicial supone un sesgo alcista modesto, no una certeza.
ends_at: "2026-10-30T13:00:00Z"
initial_yes_price: 58

