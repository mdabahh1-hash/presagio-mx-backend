id: imss-empleo-sep26-135k
tipo: binario
question: ¿El empleo formal sin plataformas digitales (IMSS) crecerá en más de 135,000 puestos en septiembre de 2026?
description: Atención, este mercado NO usa la cifra del titular. Resuelve SÍ si el aumento mensual de puestos de trabajo de septiembre de 2026 que reporte el IMSS, DESCONTANDO la variación de los puestos de plataformas digitales (repartidores y conductores que superan el umbral de ingreso), es mayor a 135,000; NO si es 135,000 o menos.
category: ECONOMIA
resolution_criteria: Del comunicado mensual del IMSS de septiembre de 2026 se toma el "aumento mensual" de puestos de trabajo y se le resta la variación mensual de los puestos de plataformas digitales (nivel al 30 de septiembre menos nivel al 31 de agosto, 199,454). Resultado mayor a 135,000 = SÍ; 135,000 o menos = NO.
resolution_source_url: https://www.imss.gob.mx/prensa
rules_cuerpo: >-
  Se toma el comunicado de prensa mensual del IMSS ("Puestos de trabajo afiliados al Instituto
  Mexicano del Seguro Social") correspondiente al 30 de septiembre de 2026, que se publica
  normalmente entre el 5 y el 10 de octubre. La cifra que resuelve es: el aumento mensual de
  puestos de trabajo reportado, MENOS la variación mensual de los puestos de plataformas
  digitales (personas que superaron el umbral de ingreso y quedaron registradas como puestos),
  del mes. Manda el comunicado de septiembre: si reporta la variación mensual de puestos de
  plataformas, se usa esa cifra; si no la reporta pero sí el nivel de agosto (aunque venga
  revisado), se usa la diferencia entre el nivel de septiembre y ese nivel de agosto del mismo
  comunicado; solo si no reporta ninguno de los dos se usa el nivel de agosto del comunicado
  anterior (199,454). Resuelve SÍ si el resultado
  es mayor a 135,000 puestos; NO si es 135,000 o menos, incluida una pérdida. No cuentan las
  "afiliaciones asociadas a un patrón", el acumulado del año ni revisiones posteriores a la
  primera publicación. El mercado cierra el 2 de octubre, antes de cualquier fecha posible de
  publicación. Si al 22 de octubre de 2026 el IMSS no ha publicado el comunicado de septiembre, o
  si este deja de desglosar los puestos de plataformas digitales, el mercado se cancela y se
  reembolsa.
rules_como: >-
  Cómo se resuelve: con el comunicado de prensa mensual del IMSS (imss.gob.mx/prensa) sobre
  puestos de trabajo afiliados al 30 de septiembre de 2026 y su PDF adjunto, que desglosa los
  puestos de plataformas digitales.
context: >-
  Por qué sin plataformas: desde el piloto de plataformas digitales (julio de 2025) el IMSS cuenta
  como puestos de trabajo a los repartidores y conductores que superan un umbral de ingreso, y
  esa cifra oscila mucho mes a mes (2026: −67,521 en enero, +40,496 en junio, −48,446 en agosto)
  sin que cambie el empleo del resto de la economía. El titular de prensa reporta el total con
  plataformas; este mercado la descuenta para medir solo el empleo formal tradicional, que es lo
  que la gente entiende por "se crearon empleos". Sin plataformas, en agosto de 2026 se crearon 86,765
  puestos y en enero–agosto 288,464 (contra 83,360 en el mismo periodo de 2025). En septiembre
  suele haber un repunte por el fin de las vacaciones y el arranque escolar; sin plataformas los
  últimos ocho septiembres dieron 136,051 (2017), 129,527 (2018), 113,850 (2020), 174,096 (2021),
  172,492 (2022), 132,558 (2023), 90,968 (2024) y 124,186 (2025), con promedio de 134,216.
ends_at: "2026-10-03T05:59:00Z"
initial_yes_price: 50
