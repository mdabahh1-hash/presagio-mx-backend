id: pib-3t26-crece
tipo: binario
question: ¿El PIB de México crecerá en el tercer trimestre de 2026 respecto al segundo (estimación oportuna del INEGI)?
description: Resuelve SÍ si la Estimación Oportuna del PIB del tercer trimestre de 2026 (INEGI, 30 de octubre de 2026) reporta una variación trimestral real, con cifras desestacionalizadas, mayor a 0.0 %; NO si es 0.0 % o negativa.
category: ECONOMIA
resolution_criteria: Variación porcentual real trimestral (cifras ajustadas por estacionalidad) del PIB total en la Estimación Oportuna del PIB Trimestral del INEGI para el tercer trimestre de 2026, con un decimal. Mayor a 0.0 = SÍ; 0.0 o negativa = NO.
resolution_source_url: https://www.inegi.org.mx/temas/pibo/
rules_cuerpo: >-
  Cuenta únicamente la variación porcentual real del PIB total del tercer trimestre de 2026
  respecto al segundo trimestre, con cifras ajustadas por estacionalidad, tal como la publique el
  INEGI en el boletín de la Estimación Oportuna del PIB Trimestral (EOPIBT) programado para el
