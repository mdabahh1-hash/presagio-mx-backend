# mercados-pendientes.yaml — mercados por sembrar en VEREDIKT.
#
# Un documento por mercado, separados por una línea `---` a solas. Esta
# cabecera y los comentarios se conservan al podar. Cuando un mercado se
# resuelve en /admin (o lo borra el cleanup de vencidos), `prune` lo quita.
#
#   ./venv/bin/python sembrar-mercados.py validar          # esquema, sin BD
#   ./venv/bin/python sembrar-mercados.py                  # dry-run contra la BD
#   ./venv/bin/python sembrar-mercados.py sembrar --apply  # escribe
#   ./venv/bin/python sembrar-mercados.py prune [--apply]  # quita los terminados
#   ./venv/bin/python sembrar-mercados.py identificar [--only ID …] [--apply]
#                                          # llena sujeto.ids de los accesorios de jugador (con red)
#
# Tipos (ver seeds/schema.py para la validación completa):
#
#   tipo: binario   — id, question, description, category (NOMBRE del enum:
#                     POLITICA_MX, ECONOMIA, DEPORTES, GLOBAL, TECH, ENTRETENIMIENTO,
#                     CRYPTO, MERCADOS_GLOBALES, MEXICO, CLIMA), subcategory?,
#                     kind? (solo DEPORTES: partido|accesorio), image_url?,
#                     resolution_criteria, resolution_source_url?,
#                     rules (texto completo) O rules_cuerpo + rules_como
#                     (obligatorio rules_como si no hay resolution_source_url),
#                     context, ends_at (2026-11-13T05:59:00Z), initial_yes_price (1-99),
#                     b? (1000), trending? (false),
#                     auto_resolucion? — receta para que el job lo resuelva solo
#                     (solo binarios de DATO PUBLICADO; ver app/services/resolucion/recetas.py):
#                       auto_resolucion: {fuente: cripto_cierre, params: {indice: BRR, symbol: BTCUSDT},
#                                         fecha: "2026-12-31", op: ">=", valor: 100000}
#                     fuentes: cripto_cierre, cripto_toca (desde + params.campo/agg),
#                     cripto_dominancia, cripto_cap_total, cripto_n_sobre_cap, stablecoins_cap,
#                     fed_tasa / banxico_tasa (params.decision + params.tipo mantiene|sube|baja),
#                     inegi_inflacion (params.periodo), federal_register_eo.
#                     Sin receta el mercado se escala para resolverlo a mano.
#                     sujeto — OBLIGATORIO en accesorios de jugador (touchdown / pases de TD /
#                     fantasy en NFL; titular / gol en las ligas de
#                     app/services/resolucion/fuentes.py:LIGAS), con kind: accesorio. Sin él
#                     `validar` da ERROR (el job resolvería por nombre y tomaría homónimos):
#                       sujeto: {jugador (idéntico al de la pregunta), equipo, rival, posicion,
#                                alcance (partido | temporada: temporada siempre se resuelve a mano),
#                                ids: {espn, cbs, uefa?, tsdb?}}
#                     ids obligatorios: NFL espn + cbs; fútbol espn, + uefa en Champions/Europa
#                     League; tsdb opcional. Pases de TD exige posicion QB. Escribe a mano
#                     jugador, equipo, rival y alcance y corre `identificar --only ID --apply`:
#                     busca ids y posicion en el plantel del equipo (nombre idéntico y único,
#                     nunca fuzzy); con cualquier error sale con código 1 y no escribe.
#                     POST /api/markets no los crea (ACCESORIO_SOLO_YAML).
#
#   tipo: multi     — igual que binario sin initial_yes_price, más
#                     outcomes: [{key, label, pct}]   (los pct suman 100)
#
#   tipo: partido   — atajo 1X2 de fútbol: id, competencia (clave de
#                     seeds/plantillas.py:COMPETENCIAS), local, visitante,
#                     kickoff (= ends_at), pct: [local, empate, visitante],
#                     ventana ("la Jornada 10 de LaLiga 2026-27 (23 al 26 de octubre)"),
#                     context, trending?, copa?, image_url?, b?
#                     El runner deriva pregunta, criterios, normas y opciones.
#
# Ejemplo:
#
# ---
# tipo: partido
# id: laliga-realmadrid-barcelona-j10-2627
# competencia: LaLiga
# local: Real Madrid
# visitante: Barcelona
# kickoff: 2026-10-25T20:00:00Z
# pct: [45, 25, 30]
# ventana: la Jornada 10 de LaLiga 2026-27 (23 al 26 de octubre de 2026)
# trending: true
# context: |
#   Clásico de la Jornada 10 en el Bernabéu. …
#
# Ejemplo de accesorio de jugador (prop NFL; sujeto ya llenado por identificar):
#
# ---
# tipo: binario
# id: nfl-allen-2tdpass-w1-2026
# question: ¿Josh Allen lanzará 2 o más pases de touchdown ante los Texans en la Semana 1 de la NFL?
# description: Bills contra Texans en la Semana 1 de la NFL 2026.
# category: DEPORTES
# subcategory: NFL
# kind: accesorio
# resolution_criteria: >-
#   Resuelve SÍ si Josh Allen (Bills) lanza 2 o más pases de touchdown ante los Texans. …
# resolution_source_url: https://www.nfl.com/scores/
# rules_cuerpo: |
#   Resuelve SÍ si Josh Allen (Bills) lanza 2 o más pases de touchdown en el partido Bills vs. Texans …
# context: |
#   Josh Allen, MVP de la temporada 2024, es el quarterback más productivo de los Bills. …
# ends_at: 2026-09-13T17:00:00Z
# initial_yes_price: 55
# sujeto:
#   jugador: Josh Allen          # a mano
#   equipo: Buffalo Bills        # a mano: el partido se elige por equipo + rival
#   rival: Houston Texans        # a mano
#   posicion: QB                 # identificar
#   alcance: partido             # a mano
#   ids:
#     espn: '3918298'            # identificar (Josh Hines-Allen, DE de JAX, es 3915239)
#     cbs: '2181054'             # identificar (Hines-Allen es 2184628)

# ── Política · rangos de diputaciones 2027 (2026-09-15) ─────────────────────
# Seis multi, uno por partido, con 5 rangos exhaustivos (sin «Otro»: las normas van completas).
# La landing de Política calcula los escaños esperados con estos precios y los puntos medios
# de cada rango declarados en contenido_categorias/politica.py (mismas keys de outcome).
# Bancada actual: sitl.diputados.gob.mx/LXVI_leg/info_diputados.php (datos al 23/03/2026).
# RP 2024: acuerdo INE/CG2129/2024 (DOF). Calendario: Consejo General del INE, 30-jul-2026.

---
tipo: multi
id: diputados-2027-rango-morena
question: ¿Cuántas diputaciones federales tendrá Morena tras la elección de 2027?
description: >-
  Rangos de escaños (300 de mayoría relativa + 200 de representación proporcional) según la asignación definitiva del INE. Cuenta solo la bancada de Morena, no la de sus aliados.
category: POLITICA_MX
subcategory: Elecciones
resolution_criteria: >-
  Gana el rango que contenga el número de diputaciones federales asignadas de forma definitiva a Morena por el Consejo General del INE (y en su caso el TEPJF) tras la elección del 6 de junio de 2027, según las constancias oficiales de asignación.
resolution_source_url: https://www.ine.mx
rules: >-
  Resuelve al rango que contenga el total de diputaciones federales (mayoría relativa más representación proporcional) asignadas de forma definitiva a Morena tras la elección del 6 de junio de 2027, según las constancias del Consejo General del INE y, si hay impugnaciones, la resolución definitiva del TEPJF. Cuenta únicamente lo asignado al partido en su constancia, no los cambios de bancada posteriores ni los escaños de otros partidos aunque compitan en coalición con él. Si el partido no participa o pierde el registro, gana el rango más bajo. Si una reforma cambia el tamaño de la Cámara, los límites de cada rango se reescalan en proporción al nuevo total, redondeando al entero más cercano. El mercado cierra el 6 de junio de 2027 y se resuelve cuando la asignación quede firme, normalmente en agosto de 2027. Gana exactamente un rango: cada acción del ganador paga 1 PT y las demás valen 0.
context: >-
  Al 23 de marzo de 2026 el grupo parlamentario de Morena tiene 254 de las 500 diputaciones (179 de mayoría relativa y 75 de representación proporcional), según la Cámara de Diputados. En la asignación de representación proporcional de 2024 (acuerdo INE/CG2129/2024, publicado en el DOF) recibió 75 de las 200 curules plurinominales. El Proceso Electoral Federal 2026-2027 inició el 10 de septiembre de 2026; la jornada es el 6 de junio de 2027 y el INE asignará las diputaciones de representación proporcional a más tardar el 23 de agosto de 2027, según el Plan Integral y Calendario que aprobó su Consejo General el 30 de julio de 2026.
ends_at: 2027-06-06T14:00:00Z
# Apertura: 254 curules hoy (179 MR); las intermedias suelen desgastar al oficialismo y las encuestas de 2026 lo muestran a la baja.
outcomes:
  - {key: r_menos_200, label: "Menos de 200", pct: 10}
  - {key: r_200_224, label: "200 a 224", pct: 23}
  - {key: r_225_249, label: "225 a 249", pct: 32}
  - {key: r_250_274, label: "250 a 274", pct: 26}
  - {key: r_275_mas, label: "275 o más", pct: 9}

