description: >-
  Rangos excluyentes para la referencia diaria de CF Benchmarks del 30 de septiembre de 2026. Solo una opción resuelve Sí.
category: CRYPTO
subcategory: Ethereum
resolution_criteria: >-
  Gana el rango que contenga el valor de la CME CF Ether-Dollar Reference Rate (ETHUSD_RR) del 30 de septiembre de 2026 publicado por CF Benchmarks. Respaldo: cierre diario UTC de ETHUSDT en Binance del mismo día.
resolution_source_url: https://www.cfbenchmarks.com
rules: >-
  Resuelve al rango que contenga el valor de la CME CF Ether-Dollar Reference Rate (ETHUSD_RR) del 30 de septiembre de 2026 (la referencia diaria de las 4:00 p.m. hora de Londres), publicado por CF Benchmarks. Cada rango incluye su límite inferior y excluye el superior: un valor exactamente igual a un límite cae en el rango que empieza en ese número. Los rangos cubren todos los valores posibles, así que siempre gana uno. El cierre diario UTC de ETHUSDT en Binance sirve como fuente de respaldo. Si la fuente oficial deja de publicar el dato o cambia su metodología antes de la resolución, el equipo de VEREDIKT usará la fuente sustituta más cercana y lo anunciará en los comentarios del mercado antes de resolver. El mercado cierra el 30 de septiembre de 2026. Gana exactamente un rango: cada acción del ganador paga 1 PT y las demás valen 0.
context: >-
  Ethereum cotizaba cerca de US$2,605 en Binance (ETHUSDT) el 18 de septiembre de 2026, con una volatilidad diaria realizada de alrededor de 2.8% en los últimos meses. La CME CF Ether-Dollar Reference Rate (ETHUSD_RR) de CF Benchmarks es la referencia diaria de las 4:00 p.m. hora de Londres con la que se liquidan los futuros del CME; Binance publica velas diarias en UTC.
ends_at: 2026-09-30T23:59:00Z
